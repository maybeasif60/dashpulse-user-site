<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashPulse - Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #38bdf8;
            font-weight: 600;
        }
        tr:hover {
            background-color: #263348;
        }
        .status-active {
            color: #4ade80;
            font-weight: bold;
        }
        .service-icons {
            display: flex;
            gap: 10px;
        }
        .service-icon-btn {
            background: #334155;
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .service-icon-btn.gmail:hover { background-color: #ea4335; color: white; }
        .service-icon-btn.drive:hover { background-color: #4285f4; color: white; }
        .service-icon-btn.docs:hover { background-color: #34a853; color: white; }
        .service-icon-btn.calendar:hover { background-color: #fbbc05; color: white; }

        /* Gmail Sidebar Layout */
        .gmail-layout {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }
        .gmail-sidebar {
            width: 230px;
            background: #1e293b;
            border-right: 1px solid #334155;
            overflow-y: auto;
            padding: 10px 0;
            flex-shrink: 0;
        }
        .gmail-sidebar-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            border-radius: 0 20px 20px 0;
            margin-right: 10px;
            transition: all 0.2s;
        }
        .gmail-sidebar-item:hover {
            background: #263348;
            color: #f8fafc;
        }
        .gmail-sidebar-item.active {
            background: #334155;
            color: #38bdf8;
            font-weight: 600;
        }
        .gmail-sidebar-item i {
            width: 20px;
            text-align: center;
        }

        .gmail-inbox-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        .gmail-inbox-item:hover {
            background: #263348;
            box-shadow: inset 3px 0 0 #38bdf8;
        }
        .gmail-sender {
            width: 200px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gmail-subject-snippet {
            flex-grow: 1;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        .gmail-subject-snippet b {
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <script>
        const adminPassword = prompt("Enter Admin Password:");
        if (adminPassword !== "asif") {
            alert("Access Denied!");
            window.location.href = "/";
        }
    </script>

    <div class="container">
        <h1>DashPulse Admin Dashboard</h1>
        <div class="card">
            <h2>Connected Clients & Services</h2>
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>Client Email</th>
                        <th>Status</th>
                        <th>Connected At</th>
                        <th>Manage Services</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading clients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Gmail Modal -->
    <div id="gmailModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#0f172a; border-radius:12px; width:90%; max-width:1050px; height:85vh; display:flex; flex-direction:column; border: 1px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.6); overflow:hidden;">
            
            <!-- Header -->
            <div style="background:#1e293b; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-envelope" style="color:#ea4335; font-size:20px;"></i>
                    <h3 style="margin:0; color:#f8fafc; font-size:18px;">Client Official Gmail Inbox Analyzer</h3>
                </div>
                <button onclick="document.getElementById('gmailModal').style.display='none'" style="background:#ef4444; border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center;">&times;</button>
            </div>
            
            <!-- Subheader & Search Bar -->
            <div style="background:#1e293b; padding:12px 20px; border-bottom:1px solid #334155; display:flex; justify-content:space-between; align-items:center; gap:15px;">
                <div id="gmailSubHeader" style="color:#38bdf8; font-size:13px; font-weight:600; white-space:nowrap;">
                    Loading...
                </div>
                <div style="position:relative; flex-grow:1; max-width:450px;">
                    <i class="fa-solid fa-magnifying-glass" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:13px;"></i>
                    <input type="text" id="gmailSearchInput" placeholder="Search mail..." onkeyup="filterGmailMessages()" style="width:100%; background:#0f172a; border:1px solid #334155; border-radius:20px; padding:8px 12px 8px 35px; color:white; font-size:13px; outline:none;">
                </div>
            </div>

            <!-- Gmail Official Layout (Sidebar + Content/Tabs) -->
            <div class="gmail-layout">
                <!-- Sidebar Menu -->
                <div class="gmail-sidebar">
                    <div class="gmail-sidebar-item active" onclick="switchFolder('INBOX', this)">
                        <i class="fa-solid fa-inbox"></i> Inbox
                    </div>
                    <div class="gmail-sidebar-item" onclick="switchFolder('STARRED', this)">
                        <i class="fa-regular fa-star"></i> Starred
                    </div>
                    <div class="gmail-sidebar-item" onclick="switchFolder('SENT', this)">
                        <i class="fa-regular fa-paper-plane"></i> Sent
                    </div>
                    <div class="gmail-sidebar-item" onclick="switchFolder('DRAFTS', this)">
                        <i class="fa-regular fa-file"></i> Drafts
                    </div>
                    <div class="gmail-sidebar-item" onclick="switchFolder('SPAM', this)">
                        <i class="fa-solid fa-circle-exclamation"></i> Spam
                    </div>
                    <div class="gmail-sidebar-item" onclick="switchFolder('TRASH', this)">
                        <i class="fa-regular fa-trash-can"></i> Trash
                    </div>
                </div>

                <!-- Main Content Area -->
                <div style="flex-grow:1; display:flex; flex-direction:column; background:#1e293b; overflow:hidden;">
                    <!-- Gmail Tabs Bar (Primary, Promotions, Social, Updates) -->
                    <div id="gmailTabsBar" style="display:flex; background:#1e293b; border-bottom:1px solid #334155; padding:0 15px;">
                        <div class="gmail-tab active" onclick="switchTab('PRIMARY', this)" style="padding:12px 15px; color:#38bdf8; cursor:pointer; font-size:13px; font-weight:600; border-bottom:2px solid #38bdf8; display:flex; align-items:center; gap:6px;">
                            <i class="fa-solid fa-inbox"></i> Primary
                        </div>
                        <div class="gmail-tab" onclick="switchTab('CATEGORY_PROMOTIONS', this)" style="padding:12px 15px; color:#94a3b8; cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;">
                            <i class="fa-solid fa-tag"></i> Promotions
                        </div>
                        <div class="gmail-tab" onclick="switchTab('CATEGORY_SOCIAL', this)" style="padding:12px 15px; color:#94a3b8; cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;">
                            <i class="fa-solid fa-user-group"></i> Social
                        </div>
                        <div class="gmail-tab" onclick="switchTab('CATEGORY_UPDATES', this)" style="padding:12px 15px; color:#94a3b8; cursor:pointer; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;">
                            <i class="fa-solid fa-circle-info"></i> Updates
                        </div>
                    </div>

                    <!-- Message List -->
                    <div id="gmailContent" style="flex-grow:1; overflow-y:auto; background:#1e293b;">
                        <p style="text-align:center; color:#94a3b8; margin-top:40px;">Loading messages...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Read Email Modal -->
    <div id="readEmailModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1100; justify-content:center; align-items:center;">
        <div style="background:#1e293b; border-radius:12px; width:80%; max-width:700px; padding:25px; border:1px solid #334155; color:white; box-shadow: 0 15px 35px rgba(0,0,0,0.7);">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:12px; margin-bottom:15px;">
                <h3 id="readSubject" style="margin:0; color:#38bdf8; font-size:18px;">Email Subject</h3>
                <button onclick="document.getElementById('readEmailModal').style.display='none'" style="background:#ef4444; border:none; color:white; width:28px; height:28px; border-radius:50%; cursor:pointer; font-weight:bold;">&times;</button>
            </div>
            <p style="color:#94a3b8; font-size:13px; margin:5px 0;">From: <b id="readSender" style="color:#f8fafc;"></b></p>
            <hr style="border:0; border-top:1px solid #334155; margin:15px 0;">
            <div id="readSnippet" style="color:#e2e8f0; font-size:14px; line-height:1.6; max-height:300px; overflow-y:auto; background:#0f172a; padding:15px; border-radius:8px;"></div>
        </div>
    </div>

    <script>
        let currentClientMessages = [];
        let activeFolder = 'INBOX';
        let activeTab = 'PRIMARY';

        async function fetchClients() {
            try {
                const response = await fetch('/api/admin/clients');
                const data = await response.json();
                const tbody = document.getElementById('clientTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No clients connected yet.</td></tr>';
                    return;
                }

                data.forEach(client => {
                    const tr = document.createElement('tr');
                    let dateStr = 'N/A';
                    if (client.createdAt && client.createdAt._seconds) {
                        dateStr = new Date(client.createdAt._seconds * 1000).toLocaleString();
                    }

                    tr.innerHTML = `
                        <td>${client.email}</td>
                        <td><span class="status-active">${client.status || 'Active'}</span></td>
                        <td>${dateStr}</td>
                        <td>
                            <div class="service-icons">
                                <button onclick="openGmailModal('${client.email}')" class="service-icon-btn gmail" title="Manage Gmail">
                                    <i class="fa-solid fa-envelope"></i>
                                </button>
                                <a href="/api/drive/files?email=${client.email}" target="_blank" class="service-icon-btn drive" title="Manage Google Drive">
                                    <i class="fa-brands fa-google-drive"></i>
                                </a>
                                <a href="/api/docs/list?email=${client.email}" target="_blank" class="service-icon-btn docs" title="Manage Google Docs">
                                    <i class="fa-solid fa-file-lines"></i>
                                </a>
                                <a href="/api/calendar/events?email=${client.email}" target="_blank" class="service-icon-btn calendar" title="Manage Calendar">
                                    <i class="fa-solid fa-calendar-days"></i>
                                </a>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching clients:', error);
            }
        }

        async function openGmailModal(email) {
            const modal = document.getElementById('gmailModal');
            const content = document.getElementById('gmailContent');
            const subHeader = document.getElementById('gmailSubHeader');
            const searchInput = document.getElementById('gmailSearchInput');
            
            modal.style.display = 'flex';
            searchInput.value = '';
            activeFolder = 'INBOX';
            activeTab = 'PRIMARY';
            
            document.querySelectorAll('.gmail-sidebar-item').forEach(t => t.classList.remove('active'));
            document.querySelector('.gmail-sidebar-item').classList.add('active');

            const tabsBar = document.getElementById('gmailTabsBar');
            tabsBar.style.display = 'flex';

            subHeader.innerHTML = `Account: <span style="color:#fff;">${email}</span>`;
            content.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">Fetching official Gmail data...</p>';

            try {
                const response = await fetch(`/api/gmail/messages?email=${email}`);
                const data = await response.json();

                if (data.messages && data.messages.length > 0) {
                    currentClientMessages = data.messages;
                    renderFilteredMessages();
                } else {
                    currentClientMessages = [];
                    content.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">No messages found.</p>';
                }
            } catch (error) {
                content.innerHTML = '<p style="text-align:center; color:#ef4444; margin-top:40px;">Error loading Gmail data.</p>';
            }
        }

        function switchFolder(folderName, element) {
            activeFolder = folderName;
            document.querySelectorAll('.gmail-sidebar-item').forEach(t => t.classList.remove('active'));
            element.classList.add('active');

            const tabsBar = document.getElementById('gmailTabsBar');
            if (folderName === 'INBOX') {
                tabsBar.style.display = 'flex';
            } else {
                tabsBar.style.display = 'none';
            }
            renderFilteredMessages();
        }

        function switchTab(tabName, element) {
            activeTab = tabName;
            document.querySelectorAll('.gmail-tab').forEach(t => {
                t.classList.remove('active');
                t.style.color = '#94a3b8';
                t.style.borderBottom = 'none';
            });
            element.classList.add('active');
            element.style.color = '#38bdf8';
            element.style.borderBottom = '2px solid #38bdf8';
            renderFilteredMessages();
        }

        function renderFilteredMessages() {
            const content = document.getElementById('gmailContent');
            const searchQuery = document.getElementById('gmailSearchInput').value.toLowerCase();

            const filtered = currentClientMessages.filter(msg => {
                const labels = msg.labelIds || [];
                let matchesFolder = false;

                if (activeFolder === 'INBOX') {
                    if (labels.includes('INBOX')) {
                        if (activeTab === 'PRIMARY') {
                            matchesFolder = !labels.includes('CATEGORY_PROMOTIONS') && 
                                            !labels.includes('CATEGORY_SOCIAL') && 
                                            !labels.includes('CATEGORY_UPDATES') && 
                                            !labels.includes('CATEGORY_FORUMS');
                        } else {
                            matchesFolder = labels.includes(activeTab);
                        }
                    }
                } else if (activeFolder === 'STARRED' && labels.includes('STARRED')) {
                    matchesFolder = true;
                } else if (activeFolder === 'SENT' && labels.includes('SENT')) {
                    matchesFolder = true;
                } else if (activeFolder === 'DRAFTS' && labels.includes('DRAFT')) {
                    matchesFolder = true;
                } else if (activeFolder === 'SPAM' && labels.includes('SPAM')) {
                    matchesFolder = true;
                } else if (activeFolder === 'TRASH' && labels.includes('TRASH')) {
                    matchesFolder = true;
                }

                const matchesSearch = msg.subject.toLowerCase().includes(searchQuery) || 
                                      msg.snippet.toLowerCase().includes(searchQuery) || 
                                      msg.from.toLowerCase().includes(searchQuery);

                return matchesFolder && matchesSearch;
            });

            if (filtered.length === 0) {
                content.innerHTML = `<p style="text-align:center; color:#94a3b8; margin-top:40px;">No messages found.</p>`;
                return;
            }

            let html = '';
            filtered.forEach(msg => {
                const encodedMsg = encodeURIComponent(JSON.stringify(msg));
                html += `
                    <div class="gmail-inbox-item" onclick="openReadEmail('${encodedMsg}')">
                        <div class="gmail-sender"><i class="fa-regular fa-star" style="color:#64748b; margin-right:8px;"></i> ${msg.from}</div>
                        <div class="gmail-subject-snippet"><b>${msg.subject}</b> - ${msg.snippet}</div>
                        <div style="color:#64748b; font-size:12px;">View</div>
                    </div>
                `;
            });
            content.innerHTML = html;
        }

        function filterGmailMessages() {
            renderFilteredMessages();
        }

        function openReadEmail(encodedMsg) {
            const msg = JSON.parse(decodeURIComponent(encodedMsg));
            document.getElementById('readSubject').innerText = msg.subject;
            document.getElementById('readSender').innerText = msg.from;
            document.getElementById('readSnippet').innerText = msg.snippet;
            document.getElementById('readEmailModal').style.display = 'flex';
        }

        fetchClients();
    </script>
</body>
</html>
