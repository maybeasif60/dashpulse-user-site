<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DashPulse - Admin Panel</title>
    <!-- FontAwesome for Service Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 30px;
        }
        .card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #38bdf8;
            font-weight: 600;
        }
        tr:hover {
            background-color: #263348;
        }
        .status-active {
            color: #4ade80;
            font-weight: bold;
        }
        /* Service Control Icons Style */
        .service-icons {
            display: flex;
            gap: 10px;
        }
        .service-icon-btn {
            background: #334155;
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
        .service-icon-btn.gmail:hover { background-color: #ea4335; color: white; }
        .service-icon-btn.drive:hover { background-color: #4285f4; color: white; }
        .service-icon-btn.docs:hover { background-color: #34a853; color: white; }
        .service-icon-btn.calendar:hover { background-color: #fbbc05; color: white; }

        /* Gmail UI Style Modal */
        .gmail-inbox-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #334155;
            background: #1e293b;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        .gmail-inbox-item:hover {
            background: #263348;
            box-shadow: inset 2px 0 0 #38bdf8;
        }
        .gmail-sender {
            width: 180px;
            font-weight: 600;
            color: #f8fafc;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gmail-snippet {
            flex-grow: 1;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 15px;
        }
        .gmail-id-badge {
            background: #334155;
            color: #38bdf8;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <script>
        // সিকিউরিটি পাসওয়ার্ড প্রটেকশন
        const adminPassword = prompt("Enter Admin Password:");
        if (adminPassword !== "asif") {
            alert("Access Denied!");
            window.location.href = "/";
        }
    </script>

    <div class="container">
        <h1>DashPulse Admin Dashboard</h1>
        <div class="card">
            <h2>Connected Clients & Services</h2>
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>Client Email</th>
                        <th>Status</th>
                        <th>Connected At</th>
                        <th>Manage Services</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading clients...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Gmail Style Modal Popup -->
    <div id="gmailModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:#0f172a; border-radius:12px; width:85%; max-width:850px; height:80vh; display:flex; flex-direction:column; border: 1px solid #334155; box-shadow: 0 15px 35px rgba(0,0,0,0.6); overflow:hidden;">
            <!-- Gmail Header Style -->
            <div style="background:#1e293b; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155;">
                <div style="display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-envelope" style="color:#ea4335; font-size:20px;"></i>
                    <h3 style="margin:0; color:#f8fafc; font-size:18px;">Client Inbox Preview</h3>
                </div>
                <button onclick="document.getElementById('gmailModal').style.display='none'" style="background:#ef4444; border:none; color:white; width:30px; height:30px; border-radius:50%; cursor:pointer; font-weight:bold; display:flex; align-items:center; justify-content:center;">&times;</button>
            </div>
            <!-- Gmail Subheader / Tabs Simulator -->
            <div style="background:#1e293b; padding:10px 20px; border-bottom:1px solid #334155; color:#38bdf8; font-size:13px; font-weight:600;" id="gmailSubHeader">
                Loading client details...
            </div>
            <!-- Gmail Message List Container -->
            <div id="gmailContent" style="flex-grow:1; overflow-y:auto; background:#1e293b;">
                <p style="text-align:center; color:#94a3b8; margin-top:40px;">Loading messages...</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchClients() {
            try {
                const response = await fetch('/api/admin/clients');
                const data = await response.json();
                
                const tbody = document.getElementById('clientTableBody');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No clients connected yet.</td></tr>';
                    return;
                }

                data.forEach(client => {
                    const tr = document.createElement('tr');
                    
                    let dateStr = 'N/A';
                    if (client.createdAt && client.createdAt._seconds) {
                        dateStr = new Date(client.createdAt._seconds * 1000).toLocaleString();
                    }

                    tr.innerHTML = `
                        <td>${client.email}</td>
                        <td><span class="status-active">${client.status || 'Active'}</span></td>
                        <td>${dateStr}</td>
                        <td>
                            <div class="service-icons">
                                <!-- Gmail Management Modal Trigger -->
                                <button onclick="openGmailModal('${client.email}')" class="service-icon-btn gmail" title="Manage Gmail">
                                    <i class="fa-solid fa-envelope"></i>
                                </button>
                                <!-- Google Drive Management -->
                                <a href="/api/drive/files?email=${client.email}" target="_blank" class="service-icon-btn drive" title="Manage Google Drive">
                                    <i class="fa-brands fa-google-drive"></i>
                                </a>
                                <!-- Google Docs Management -->
                                <a href="/api/docs/list?email=${client.email}" target="_blank" class="service-icon-btn docs" title="Manage Google Docs">
                                    <i class="fa-solid fa-file-lines"></i>
                                </a>
                                <!-- Google Calendar Management -->
                                <a href="/api/calendar/events?email=${client.email}" target="_blank" class="service-icon-btn calendar" title="Manage Calendar">
                                    <i class="fa-solid fa-calendar-days"></i>
                                </a>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error fetching clients:', error);
                document.getElementById('clientTableBody').innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444;">Failed to load data.</td></tr>';
            }
        }

        async function openGmailModal(email) {
            const modal = document.getElementById('gmailModal');
            const content = document.getElementById('gmailContent');
            const subHeader = document.getElementById('gmailSubHeader');
            
            modal.style.display = 'flex';
            subHeader.innerHTML = `Connected Account: <span style="color:#fff;">${email}</span>`;
            content.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">Fetching emails from Gmail API...</p>';

            try {
                const response = await fetch(`/api/gmail/messages?email=${email}`);
                const data = await response.json();

                if (data.messages && data.messages.length > 0) {
                    let html = '';
                    data.messages.forEach(msg => {
                        html += `
                            <div class="gmail-inbox-item">
                                <div class="gmail-sender"><i class="fa-regular fa-star" style="color:#64748b; margin-right:10px;"></i> Google / System</div>
                                <div class="gmail-snippet">Thread message reference ID snippet data stream</div>
                                <div class="gmail-id-badge">ID: ${msg.id.substring(0, 10)}...</div>
                            </div>
                        `;
                    });
                    content.innerHTML = html;
                } else {
                    content.innerHTML = '<p style="text-align:center; color:#94a3b8; margin-top:40px;">No messages found for this client.</p>';
                }
            } catch (error) {
                content.innerHTML = '<p style="text-align:center; color:#ef4444; margin-top:40px;">Error loading messages from Gmail.</p>';
            }
        }

        fetchClients();
    </script>
</body>
</html>
